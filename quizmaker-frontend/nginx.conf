server {
    listen 80;
    server_name quizzence.com www.quizzence.com;

    root /usr/share/nginx/html;
    index index.html;

    # Bounded identity of the immutable image, never request/user data.
    location = /__release.json {
        expires -1;
        try_files /__release.json =404;
    }

    # Repeat the include in locations with their own add_header directives.
    include /etc/nginx/includes/security-headers.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve the existing app shell for unknown documents without changing their URL or 404 status.
    location = /__not-found-shell {
        internal;
        alias /usr/share/nginx/html/404.html;
        default_type text/html;
        include /etc/nginx/includes/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Static assets and public crawl files must never fall through to the SPA shell.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|map)$ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/includes/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.xml$ {
        try_files $uri =404;
        expires 1h;
        include /etc/nginx/includes/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # try_files fallbacks internally redirect here; keep the SPA shell reachable only from allowlisted routes.
    location = /index.html {
        expires -1;
        try_files /index.html =404;
    }

    # Generated from the same route policy used by React, sitemap generation, and prerendering.
    include /etc/nginx/includes/public-routes.conf;

    # Authenticated SPA routes remain directly navigable without granting a blanket fallback.
    location ~ ^/quizzes/?$ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location ~ ^/quizzes/[^/]+(?:/(?:attempt(?:/start)?|results|edit|results-summary|questions|generation))?/?$ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location ~ ^/(?:my-quizzes|tags|categories|questions|bug-reports|admin|ai-analysis|form-test|profile|settings|billing(?:/(?:success|cancel))?|my-attempts)/?$ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location ~ ^/documents(?:/(?:upload|[^/]+))?/?$ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # Unknown paths and malformed route shapes receive a real 404 instead of index.html.
    location / {
        error_page 404 =404 /__not-found-shell;
        return 404;
    }
}
