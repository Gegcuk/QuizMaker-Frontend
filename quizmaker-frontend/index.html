    <script id="sensitive-url-bootstrap">
      (function () {
        var pathname = window.location.pathname;
        var normalizedPath = pathname.length > 1 ? pathname.replace(/\/+$/, '') : pathname;
        var sensitivePaths = [
          '/reset-password',
          '/verify-email',
          '/billing/success',
          '/oauth2/redirect',
          '/oauth/callback'
        ];
        if (sensitivePaths.indexOf(normalizedPath) === -1) return;

        var params = new URLSearchParams(window.location.search);
        var capturedAt = Date.now();
        var readBounded = function (name, maxLength) {
          var raw = params.get(name);
          if (raw === null) return null;
          var value = raw.trim();
          return value && value.length <= maxLength ? value : null;
        };
        var store = function (key, value) {
          try {
            sessionStorage.setItem(key, JSON.stringify(value));
          } catch (_) {
            // URL cleanup still takes precedence if tab storage is unavailable.
          }
        };

        if (normalizedPath === '/reset-password') {
          var resetToken = readBounded('token', 2048);
          if (resetToken) {
            store('quizzence:auth:password-reset:v1', {
              version: 1,
              kind: 'passwordReset',
              capturedAt: capturedAt,
              values: { token: resetToken }
            });
          }
        } else if (normalizedPath === '/verify-email') {
          var verificationToken = readBounded('token', 512);
          var email = readBounded('email', 320);
          if (verificationToken || email) {
            store('quizzence:auth:email-verification:v1', {
              version: 1,
              kind: 'emailVerification',
              capturedAt: capturedAt,
              values: { token: verificationToken, email: email }
            });
          }
        } else if (normalizedPath === '/billing/success') {
          var sessionId = readBounded('session_id', 512);
          if (sessionId) {
            store('quizzence:billing:checkout-return:v1', {
              version: 1,
              kind: 'billingCheckout',
              capturedAt: capturedAt,
              values: { sessionId: sessionId }
            });
          }
        } else {
          var code = readBounded('code', 43);
          var error = readBounded('error', 64);
          var allowedErrors = [
            'oauth_access_denied',
            'oauth_authentication_failed',
            'oauth_flow_invalid',
            'oauth_login_temporarily_unavailable',
            'oauth_login_failed'
          ];
          var oauthCallback = null;

          if (code && /^[A-Za-z0-9_-]{43}$/.test(code)) {
            oauthCallback = { version: 1, kind: 'code', value: code, capturedAt: capturedAt };
          } else if (error && allowedErrors.indexOf(error) !== -1) {
            oauthCallback = { version: 1, kind: 'error', value: error, capturedAt: capturedAt };
          } else if (params.has('code') || params.has('error')) {
            oauthCallback = {
              version: 1,
              kind: 'error',
              value: 'oauth_flow_invalid',
              capturedAt: capturedAt
            };
          }

          if (oauthCallback) {
            store('quizzence:oauth:callback:v1', oauthCallback);
          }
        }

        if (window.location.search || window.location.hash) {
          history.replaceState(history.state, '', pathname);
        }
      })();
    </script>
