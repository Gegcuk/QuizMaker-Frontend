    <script id="oauth-callback-bootstrap">
      (function () {
        var callbackPaths = ['/oauth2/redirect', '/oauth/callback'];
        if (callbackPaths.indexOf(window.location.pathname) === -1) return;

        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var error = params.get('error');
        var accessToken = params.get('accessToken') || params.get('access_token');
        var refreshToken = params.get('refreshToken') || params.get('refresh_token');
        var hasLegacyToken = accessToken !== null || refreshToken !== null;
        var allowedErrors = [
          'oauth_access_denied',
          'oauth_authentication_failed',
          'oauth_flow_invalid',
          'oauth_legacy_login_expired',
          'oauth_login_temporarily_unavailable',
          'oauth_login_failed'
        ];
        var captured = null;

        if (code && /^[A-Za-z0-9_-]{43}$/.test(code)) {
          captured = { version: 1, kind: 'code', value: code, capturedAt: Date.now() };
        } else if (error && allowedErrors.indexOf(error) !== -1) {
          captured = { version: 1, kind: 'error', value: error, capturedAt: Date.now() };
        } else if (code !== null || error !== null) {
          captured = { version: 1, kind: 'error', value: 'oauth_flow_invalid', capturedAt: Date.now() };
        }

        if (captured || hasLegacyToken) {
          try {
            if (captured) {
              sessionStorage.setItem('quizzence:oauth:callback:v1', JSON.stringify(captured));
            } else {
              sessionStorage.setItem('quizzence:oauth:legacy-test:v1', JSON.stringify({
                version: 1,
                accessToken: accessToken,
                refreshToken: refreshToken,
                capturedAt: Date.now()
              }));
            }
          } catch (_) {
            // URL cleanup still takes precedence if tab storage is unavailable.
          }
          history.replaceState(history.state, '', window.location.pathname + window.location.hash);
        }
      })();
    </script>
