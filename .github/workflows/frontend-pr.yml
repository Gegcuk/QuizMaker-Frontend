name: Frontend PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: quizmaker-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: quizmaker-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare immutable browser environment
        id: browser
        timeout-minutes: 6
        run: node scripts/browser/environment.mjs prepare "$RUNNER_TEMP/browser-state.json"

      - name: Validate frontend gates
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/host-browser-cache-empty
          VALIDATION_METRICS_FILE: ${{ runner.temp }}/frontend-validation.json
        run: node scripts/deployment/validate-frontend.mjs pr

      - name: Stop task-owned browser environment
        if: ${{ always() && steps.browser.outcome != 'skipped' }}
        timeout-minutes: 1
        run: node scripts/browser/environment.mjs stop "$RUNNER_TEMP/browser-state.json"
