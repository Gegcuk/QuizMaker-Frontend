name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate the production artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest_digest: ${{ steps.build.outputs.manifest_digest }}
      release_id: ${{ steps.build.outputs.release_id }}
      producer_run: ${{ steps.build.outputs.producer_run }}
      producer_attempt: ${{ steps.build.outputs.producer_attempt }}
    defaults:
      run:
        working-directory: quizmaker-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: quizmaker-frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:production
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint -- --quiet
      - name: Test
        run: npm test
      - name: SEO source contract tests with local fixtures
        run: npm run test:seo
      - name: Validate deployment workflow and failure recovery
        run: npm run test:deployment-policy
      - name: Build production artifact once
        id: build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: bash scripts/deployment/build-release.sh
      - name: Validate the exported image
        env:
          RELEASE_MANIFEST_DIGEST: ${{ steps.build.outputs.manifest_digest }}
        run: npm run test:release
      - name: Upload the validated image and provenance
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quizmaker-frontend/release-bundle/
          if-no-files-found: error
          compression-level: 0

  deploy:
    name: Activate verified frontend candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    outputs:
      consumer_completed: ${{ steps.completed.outputs.consumer_completed }}
      consumed_artifact_id: ${{ needs.validate.outputs.artifact_id }}
      consumed_manifest_digest: ${{ needs.validate.outputs.manifest_digest }}
      producer_run: ${{ needs.validate.outputs.producer_run }}
      producer_attempt: ${{ needs.validate.outputs.producer_attempt }}
    steps:
      - name: Checkout verifier from the same revision
        uses: actions/checkout@v7
      - name: Download the exact validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: release-bundle
          digest-mismatch: error
      - name: Verify downloaded provenance and image digest
        env:
          MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
        run: python3 quizmaker-frontend/scripts/deployment/artifact.py verify --digest "$MANIFEST_DIGEST"
      - name: Prepare isolated incoming directory
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_RUN: ${{ needs.validate.outputs.producer_run }}
          RELEASE_ATTEMPT: ${{ needs.validate.outputs.producer_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: RELEASE_RUN,RELEASE_ATTEMPT
          script: |
            set -eu
            test -x /usr/local/sbin/quizzence-release
            mkdir -p "/var/www/quizzence/incoming/${RELEASE_RUN}-${RELEASE_ATTEMPT}"
      - name: Transfer verified image without touching serving files
        uses: burnett01/rsync-deployments@9.0.0
        with:
          switches: -avz
          path: release-bundle/
          remote_path: /var/www/quizzence/incoming/${{ needs.validate.outputs.producer_run }}-${{ needs.validate.outputs.producer_attempt }}/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
      - name: Submit rollout and wait for verified consumer receipt
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_RUN: ${{ needs.validate.outputs.producer_run }}
          RELEASE_ATTEMPT: ${{ needs.validate.outputs.producer_attempt }}
          RELEASE_REVISION: ${{ github.sha }}
          MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 22m
          envs: RELEASE_RUN,RELEASE_ATTEMPT,RELEASE_REVISION,MANIFEST_DIGEST,ARTIFACT_ID
          script: |
            set -eu
            helper=/usr/local/sbin/quizzence-release
            if ! sudo -n "$helper" status "$RELEASE_RUN" "$RELEASE_ATTEMPT" >/dev/null 2>&1; then
              sudo -n "$helper" submit "$RELEASE_RUN" "$RELEASE_ATTEMPT" "$RELEASE_REVISION" "$MANIFEST_DIGEST" "$ARTIFACT_ID"
            fi
            for attempt in $(seq 1 240); do
              receipt="$(sudo -n "$helper" status "$RELEASE_RUN" "$RELEASE_ATTEMPT")"
              status="$(printf '%s' "$receipt" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
              case "$status" in
                succeeded)
                  printf '%s' "$receipt" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r.get("consumer_completed") is True; assert (r["manifest_digest"],r["artifact_id"],r["revision"]) == tuple(sys.argv[1:]); print("Verified consumer receipt:", r["release_id"], r["image_sha256"])' "$MANIFEST_DIGEST" "$ARTIFACT_ID" "$RELEASE_REVISION"
                  # Only this attempt's upload copy; root-owned recovery images remain.
                  if ! rm -f -- "/var/www/quizzence/incoming/${RELEASE_RUN}-${RELEASE_ATTEMPT}/image.tar" "/var/www/quizzence/incoming/${RELEASE_RUN}-${RELEASE_ATTEMPT}/provenance.json" || ! rmdir -- "/var/www/quizzence/incoming/${RELEASE_RUN}-${RELEASE_ATTEMPT}"; then
                    echo 'Verified release active; incoming upload copy retained for operator cleanup'
                  fi
                  exit 0 ;;
                failed|recovery-required) echo "Rollout $status; inspect the durable host receipt"; exit 1 ;;
                queued|running) sleep 5 ;;
                *) echo 'Invalid consumer status'; exit 1 ;;
              esac
            done
            echo 'Consumer completion is unverified; the host service and recovery journal remain authoritative'
            exit 1
      - name: Record successful consumption
        id: completed
        env:
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        run: |
          echo 'consumer_completed=true' >> "$GITHUB_OUTPUT"
          printf 'Verified release `%s`; consumed artifact `%s`; provenance SHA256 `%s`.\n' "$RELEASE_ID" "$ARTIFACT_ID" "$MANIFEST_DIGEST" >> "$GITHUB_STEP_SUMMARY"
